spring.application.name=vegetariano

# 🌐 CONEXIÓN DINÁMICA
# Si está en Render, usará la variable de entorno. 
# Si está en tu PC, usará el localhost de MariaDB (Puerto 3306).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/grupo02?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}

# 📦 JPA / HIBERNATE
# Hibernate detectará automáticamente si es Postgres (Render) o MySQL (Local)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ⚙️ PUERTO
# Render usa un puerto dinámico; localmente usaremos el 8080
server.port=${PORT:8080}

# 🔐 SEGURIDAD
