spring.application.name=vegetariano

# ==============================
# 🌐 CONEXIÓN DINÁMICA (Local vs Render)
# ==============================
# Eliminamos el driver-class-name para que Spring elija el correcto solo
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/grupo02?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}

# ==============================
# 📦 JPA / HIBERNATE
# ==============================
# Quitamos el dialecto fijo para que Hibernate lo detecte según la conexión
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==============================
# ⚙️ CONFIGURACIÓN DE RED
# ==============================
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET:95fc8e994d67e99f91b18b606a8a2d89e477aa141c598063f0c034201790845c3cc53d6cdcd1393e09d260}
