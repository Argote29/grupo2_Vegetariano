spring.application.name=vegetariano


# ==============================
# 🌐 CONEXIÓN A MARIA DB (Local)
# ==============================
# El puerto 3306 es el que sale en tu foto de HeidiSQL
spring.datasource.url=jdbc:mysql://localhost:3306/grupo02?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# 📦 CONFIGURACIÓN JPA / HIBERNATE
# ==============================
spring.jpa.database=mysql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Usamos el dialecto de MySQL/MariaDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

